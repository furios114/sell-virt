<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discomfi Market — Telegram аккаунты с отлегой</title>
<meta name="description" content="Премиальные Telegram аккаунты с отлегой. 240 стран. Отлега 2013–2026.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23c9a227'/><text x='50' y='70' font-size='64' text-anchor='middle' fill='%230a0a0f' font-family='Georgia' font-weight='bold'>D</text></svg>">
<meta property="og:title" content="Discomfi Market — Telegram аккаунты">
<meta property="og:description" content="240 стран. Отлега 2013–2026. Надёжно, конфиденциально.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08080c;--bg-soft:#101016;
  --border:rgba(255,255,255,.07);
  --text:#f2f0ea;--muted:#8a8a96;--dim:#55555f;
  --gold:#c9a227;--gold-soft:#e0bc4a;
  --gold-dim:rgba(201,162,39,.12);--gold-border:rgba(201,162,39,.25);
  --e:cubic-bezier(.22,1,.36,1);--hh:78px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font:15.5px/1.6 Inter,system-ui,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;position:relative}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font:inherit;color:inherit}
::selection{background:rgba(201,162,39,.3);color:#fff}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:rgba(201,162,39,.2);border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:rgba(201,162,39,.4)}

/* ФОН */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:radial-gradient(1200px 800px at 15% -10%,rgba(201,162,39,.08),transparent 60%),radial-gradient(1000px 700px at 90% 0,rgba(124,92,255,.06),transparent 60%),radial-gradient(900px 900px at 50% 120%,rgba(201,162,39,.05),transparent 60%),var(--bg)}
#stars{position:absolute;inset:0;width:100%;height:100%}

/* LAYOUT */
.app{padding-top:var(--hh);min-height:calc(100vh - var(--hh))}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
.section{padding:84px 0;animation:fadeUp .8s var(--e) both}
.section-head{text-align:center;max-width:760px;margin:0 auto 56px}
.h2{font-family:'Playfair Display',Georgia,serif;font-size:clamp(30px,4.4vw,48px);font-weight:400;letter-spacing:-.02em;line-height:1.1;margin-bottom:16px}
.sub{font-size:16.5px;color:var(--muted);line-height:1.65;max-width:620px;margin:0 auto}
.grad{background:linear-gradient(135deg,#e0bc4a,#c9a227 60%,#a37f12);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-style:italic;font-family:'Playfair Display',Georgia,serif}
/* HEADER */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:100;display:flex;align-items:center;background:rgba(8,8,12,.6);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid rgba(201,162,39,.08);transition:background .4s var(--e),box-shadow .4s var(--e),border-color .4s var(--e)}
.hdr.scrolled{background:rgba(8,8,12,.85);box-shadow:0 6px 30px rgba(0,0,0,.4);border-bottom-color:rgba(201,162,39,.15)}
.hdr-in{width:100%;max-width:1280px;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:inline-flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.02em}
.logo-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#e0bc4a,#c9a227);color:#08080c;font-size:14px;font-weight:800;box-shadow:0 8px 24px rgba(201,162,39,.3);position:relative;overflow:hidden;transition:transform .4s var(--e)}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.05)}
.logo-mark::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:shine 4s var(--e) infinite}
.logo-text{font-size:15.5px;font-family:'Playfair Display',Georgia,serif;font-weight:700;letter-spacing:.02em}
.logo-text b{color:var(--gold);font-weight:700}

.nav{display:flex;align-items:center;gap:6px}
.nav a{padding:9px 16px;font-size:14.5px;font-weight:500;color:var(--muted);border-radius:99px;transition:all .25s var(--e)}
.nav a:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nav a.active{color:var(--gold);background:var(--gold-dim);border:1px solid var(--gold-border)}

.hdr-cta{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:99px;background:linear-gradient(135deg,#e0bc4a,#c9a227);color:#08080c;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;position:relative;overflow:hidden;transition:transform .35s var(--e),box-shadow .35s var(--e);box-shadow:0 8px 24px rgba(201,162,39,.25)}
.hdr-cta::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.5),transparent 50%);transform:translateX(-100%);transition:transform .7s var(--e)}
.hdr-cta:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(201,162,39,.4)}
.hdr-cta:hover::before{transform:translateX(100%)}

.burger{display:none;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--border);position:relative;transition:background .3s var(--e)}
.burger span{position:absolute;left:11px;right:11px;height:2px;background:var(--gold);border-radius:2px;transition:transform .4s var(--e),opacity .3s var(--e)}
.burger span:nth-child(1){top:13px}
.burger span:nth-child(2){top:19px}
.burger span:nth-child(3){top:25px}
.burger.open span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.burger.open span:nth-child(2){opacity:0}
.burger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 26px;border-radius:99px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;position:relative;overflow:hidden;white-space:nowrap;transition:transform .35s var(--e),box-shadow .35s var(--e),background .3s var(--e),color .3s var(--e),border-color .3s var(--e)}
.btn-primary{background:linear-gradient(135deg,#e0bc4a,#c9a227);color:#08080c;box-shadow:0 8px 24px rgba(201,162,39,.25)}
.btn-primary::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.5),transparent 50%);transform:translateX(-100%);transition:transform .7s var(--e)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(201,162,39,.4)}
.btn-primary:hover::before{transform:translateX(100%)}
.btn-glass{background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--border)}
.btn-glass:hover{transform:translateY(-3px);background:rgba(255,255,255,.07);border-color:var(--gold-border);color:var(--gold)}
.btn-sm{padding:9px 16px;font-size:12.5px}
.btn-lg{padding:16px 32px;font-size:14.5px}
.btn-block{width:100%}
/* FIELD / FILTER */
.field{display:flex;align-items:center;gap:10px;padding:0 16px;height:46px;border-radius:99px;background:rgba(255,255,255,.03);border:1px solid var(--border);transition:border-color .25s var(--e),box-shadow .25s var(--e),background .25s var(--e)}
.field:focus-within{border-color:var(--gold-border);box-shadow:0 0 0 4px rgba(201,162,39,.08);background:rgba(255,255,255,.05)}
.field svg{color:var(--muted);flex-shrink:0}
.field input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:14.5px;font-weight:500}
.field input::placeholder{color:var(--dim)}

.filter-bar{display:grid;grid-template-columns:1.4fr 1fr 1fr auto;gap:12px;padding:16px;border-radius:26px;background:rgba(255,255,255,.02);border:1px solid var(--border);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);margin-bottom:32px;position:relative;z-index:10}
.filter-actions{display:flex;gap:8px;align-items:center}
.sort-btn{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:99px;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--muted);transition:all .3s var(--e);flex-shrink:0}
.sort-btn:hover{color:var(--gold);border-color:var(--gold-border);transform:translateY(-1px)}
.sort-btn.active{background:linear-gradient(135deg,#e0bc4a,#c9a227);color:#08080c;border-color:transparent;box-shadow:0 8px 24px rgba(201,162,39,.25)}

/* DROPDOWN */
.field-dd{padding:0;position:relative;z-index:20}
.dd-btn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;height:100%;padding:0 16px;font-size:14.5px;font-weight:500;color:var(--text);background:transparent;text-align:left}
.dd-value{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-arrow{color:var(--muted);transition:transform .4s var(--e);display:flex}
.field-dd.open .dd-arrow{transform:rotate(180deg)}
.dd-list{position:absolute;top:calc(100% + 8px);left:0;right:0;max-height:340px;border-radius:20px;background:rgba(16,16,22,.97);border:1px solid var(--border);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 20px 60px rgba(0,0,0,.6);padding:10px;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.98);transition:all .35s var(--e);z-index:100;overflow:hidden;display:flex;flex-direction:column;pointer-events:none}
.field-dd.open .dd-list{opacity:1;visibility:visible;transform:translateY(0) scale(1);pointer-events:auto}
.dd-search{width:100%;padding:10px 14px;margin-bottom:6px;border-radius:99px;background:rgba(255,255,255,.04);border:1px solid transparent;font-size:14px;outline:none;color:var(--text);transition:all .25s var(--e)}
.dd-search:focus{background:rgba(255,255,255,.06);border-color:var(--gold-border)}
.dd-items{overflow-y:auto;flex:1;padding-right:4px}
.dd-item{padding:9px 14px;border-radius:14px;font-size:14px;color:var(--muted);cursor:pointer;transition:all .25s var(--e);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-item:hover{background:rgba(201,162,39,.1);color:var(--text)}
.dd-item.active{background:linear-gradient(135deg,#e0bc4a,#c9a227);color:#08080c;font-weight:600}
.dd-items::-webkit-scrollbar{width:6px}
.dd-items::-webkit-scrollbar-thumb{background:rgba(201,162,39,.2);border-radius:99px}
/* PAGE / HERO */
.page{animation:pageIn .65s var(--e) both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

.hero{position:relative;padding:100px 0 90px;text-align:center;overflow:hidden}
.hero::before{content:'';position:absolute;top:10%;left:50%;width:720px;height:720px;transform:translateX(-50%);background:radial-gradient(closest-side,rgba(201,162,39,.12),transparent 70%);filter:blur(50px);z-index:-1;pointer-events:none}
.hero-title{font-family:'Playfair Display',Georgia,serif;font-size:clamp(46px,8.5vw,116px);font-weight:400;letter-spacing:-.04em;line-height:.98;margin-bottom:28px;display:inline-block;animation:heroIn 1s var(--e) both}
.hero-title .grad{position:relative}
.hero-title .grad::before{content:'';position:absolute;inset:-20%;background:radial-gradient(closest-side,rgba(201,162,39,.25),transparent 70%);filter:blur(40px);z-index:-1;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.15)}}
@keyframes heroIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
.hero-sub{font-size:clamp(15.5px,1.6vw,18px);color:var(--muted);max-width:620px;margin:0 auto 40px;line-height:1.7;animation:heroIn 1s .12s var(--e) both}
.hero-actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:36px;animation:heroIn 1s .22s var(--e) both}
.hero-manager{display:inline-flex;align-items:center;gap:10px;margin:0 auto 40px;padding:10px 22px;border-radius:99px;background:rgba(255,255,255,.03);border:1px solid var(--border);position:relative;overflow:hidden;animation:heroIn 1s .18s var(--e) both;transition:transform .4s var(--e),border-color .4s var(--e)}
.hero-manager::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(201,162,39,.1),transparent);transform:translateX(-100%);animation:shine 5s var(--e) infinite;pointer-events:none}
.hero-manager:hover{transform:translateY(-2px);border-color:var(--gold-border)}
.hero-manager-label{font-size:12px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.hero-manager-link{font-family:'JetBrains Mono',monospace;font-size:14.5px;font-weight:700;color:var(--gold);transition:color .25s var(--e)}

.hero-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:960px;margin:0 auto;animation:heroIn 1s .32s var(--e) both}
.hero-stat{padding:24px 18px;border-radius:24px;background:rgba(255,255,255,.025);border:1px solid var(--border);transition:transform .4s var(--e),border-color .4s var(--e),background .4s var(--e)}
.hero-stat:hover{transform:translateY(-4px);border-color:var(--gold-border);background:rgba(255,255,255,.045)}
.hero-stat b{display:block;font-family:'Playfair Display',Georgia,serif;font-size:clamp(22px,2.6vw,32px);font-weight:400;background:linear-gradient(135deg,#e0bc4a,#c9a227);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.hero-stat span{font-size:11.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}

/* STEPS */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.step{padding:30px 24px;border-radius:24px;background:rgba(255,255,255,.025);border:1px solid var(--border);transition:transform .4s var(--e),border-color .4s var(--e),background .4s var(--e)}
.step:hover{transform:translateY(-5px);border-color:var(--gold-border);background:rgba(255,255,255,.045)}
.step-num{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#e0bc4a,#c9a227);color:#08080c;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:19px;margin-bottom:18px;box-shadow:0 8px 24px rgba(201,162,39,.25)}
.step h3{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:400;margin-bottom:10px}
.step p{font-size:14.5px;color:var(--muted);line-height:1.65}

/* PAGE HEADER */
.page-header{text-align:center;padding:70px 0 40px}
.page-title{font-family:'Playfair Display',Georgia,serif;font-size:clamp(34px,5vw,64px);font-weight:400;letter-spacing:-.03em;line-height:1.05;margin-bottom:16px}
.page-sub{font-size:16px;color:var(--muted);max-width:560px;margin:0 auto;line-height:1.7}
/* CATALOG / CARDS */
.catalog-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
.catalog-title{font-family:'Playfair Display',Georgia,serif;font-size:clamp(26px,3.4vw,40px);font-weight:400}
.catalog-meta{font-size:14px;color:var(--dim);font-weight:500}
.catalog-meta b{color:var(--gold);font-weight:700}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.card{position:relative;padding:22px;border-radius:24px;background:rgba(255,255,255,.025);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;gap:14px;transition:transform .45s var(--e),border-color .4s var(--e),background .4s var(--e),box-shadow .4s var(--e);animation:cardIn .6s var(--e) both}
.card:hover{transform:translateY(-5px);border-color:var(--gold-border);background:rgba(255,255,255,.045);box-shadow:0 20px 50px rgba(0,0,0,.4)}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-flag{font-size:34px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));transition:transform .5s var(--e)}
.card:hover .card-flag{transform:scale(1.15) rotate(-6deg)}
.card-year{padding:6px 12px;border-radius:99px;background:var(--gold-dim);border:1px solid var(--gold-border);color:var(--gold);font-size:12.5px;font-weight:700;font-family:'JetBrains Mono',monospace}
.card-country{font-size:18px;font-weight:700;line-height:1.25}
.card-code{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:600;color:var(--dim)}
.card-divider{height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
.card-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-label{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.card-price{font-size:20px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--gold)}
.card-price.ls{font-size:15px;font-family:inherit;font-weight:700}
.card .btn{margin-top:auto}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}

.empty{text-align:center;padding:80px 24px;border-radius:32px;background:rgba(255,255,255,.015);border:1px dashed var(--border);color:var(--muted)}
.empty h3{font-size:20px;font-weight:700;margin-bottom:8px;color:var(--text)}

/* SPECIAL */
.special-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:24px;padding:28px;border-radius:32px;background:rgba(255,255,255,.025);border:1px solid var(--border);margin-top:26px;transition:border-color .4s var(--e),transform .4s var(--e)}
.special-card:hover{border-color:var(--gold-border);transform:translateY(-3px)}
.special-icon{display:grid;place-items:center;width:60px;height:60px;border-radius:18px;background:linear-gradient(135deg,#e0bc4a,#c9a227);color:#08080c;font-size:26px}
.special-body h3{font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:400;margin-bottom:6px}
.special-body p{font-size:14.5px;color:var(--muted)}
.special-price{font-size:22px;font-weight:800;font-family:'JetBrains Mono',monospace;margin-bottom:8px;color:var(--gold)}

/* FAQ */
.faq-list{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.faq-item{border-radius:24px;background:rgba(255,255,255,.025);border:1px solid var(--border);overflow:hidden;transition:border-color .35s var(--e),background .35s var(--e)}
.faq-item:hover{border-color:var(--gold-border);background:rgba(255,255,255,.04)}
.faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 26px;font-family:'Playfair Display',Georgia,serif;font-size:18px;text-align:left;transition:color .3s var(--e)}
.faq-item:hover .faq-q{color:var(--gold)}
.faq-icon{flex-shrink:0;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--gold-dim);color:var(--gold);transition:all .4s var(--e);font-size:20px}
.faq-item.open .faq-icon{transform:rotate(45deg);background:linear-gradient(135deg,#e0bc4a,#c9a227);color:#08080c}
.faq-a{max-height:0;overflow:hidden;transition:max-height .7s var(--e)}
.faq-a-in{padding:0 26px 24px;font-size:14.8px;line-height:1.75;color:var(--muted)}

/* CONTACT */
.contact-card{max-width:620px;margin:0 auto;padding:48px 36px;border-radius:32px;background:rgba(255,255,255,.025);border:1px solid var(--border);text-align:center;position:relative;overflow:hidden}
.contact-avatar{width:84px;height:84px;border-radius:24px;margin:0 auto 22px;background:linear-gradient(135deg,#e0bc4a,#c9a227);display:grid;place-items:center;color:#08080c;font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:700;box-shadow:0 12px 32px rgba(201,162,39,.3);animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.contact-name{font-family:'Playfair Display',Georgia,serif;font-size:26px;margin-bottom:8px}
.contact-handle{font-family:'JetBrains Mono',monospace;font-size:15px;color:var(--gold);font-weight:600;margin-bottom:26px}
.contact-note{font-size:14px;color:var(--dim);margin-top:18px}
/* FOOTER */
.ft{position:relative;margin-top:100px;padding:60px 0 30px;background:rgba(255,255,255,.015);border-top:1px solid var(--border)}
.ft-in{max-width:1280px;margin:0 auto;padding:0 28px;display:grid;grid-template-columns:1.4fr 1fr;gap:60px;margin-bottom:40px}
.ft-brand p{margin-top:14px;color:var(--muted);font-size:14.5px;max-width:380px;line-height:1.7}
.ft-cols{display:grid;grid-template-columns:1fr 1fr;gap:40px}

<script>
  (function(){
    const canvas = document.getElementById('stars');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let w, h, stars = [], animId;
    const isMobile = window.matchMedia('(max-width: 640px)').matches;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const COUNT = isMobile ? 60 : 140;
    function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    function makeStar() {
      return { x: Math.random()*w, y: Math.random()*h, r: Math.random()*1.4+0.3, speed: Math.random()*0.15+0.05, opacity: Math.random()*0.6+0.2, twinkle: Math.random()*Math.PI*2, twinkleSpeed: Math.random()*0.015+0.005, gold: Math.random() < 0.3 };
    }
    function init() { resize(); stars = []; for (let i=0;i<COUNT;i++) stars.push(makeStar()); }
    function draw() {
      ctx.clearRect(0,0,w,h);
      for (let i=0;i<stars.length;i++) {
        const s = stars[i];
        s.y -= s.speed;
        if (s.y < -2) { s.y = h+2; s.x = Math.random()*w; }
        s.twinkle += s.twinkleSpeed;
        const alpha = s.opacity * (0.6 + Math.sin(s.twinkle)*0.4);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
        ctx.fillStyle = s.gold ? `rgba(201,162,39,${alpha})` : `rgba(242,240,234,${alpha})`;
        ctx.fill();
      }
      animId = requestAnimationFrame(draw);
    }
    window.addEventListener('resize', () => { resize(); init(); }, { passive: true });
    document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(animId); else draw(); });
    init(); draw();
  })();
</script>

  var meta=el('div',{class:'catalog-meta'});
  ch.appendChild(meta);
  wrap.appendChild(ch);
  var grid=el('div',{class:'cards'});
  wrap.appendChild(grid);

  var sp=el('div',{class:'special-card'});
  sp.appendChild(el('div',{class:'special-icon',html:'🔄'}));
  var spB=el('div',{class:'special-body'});
  spB.appendChild(el('h3',{text:'Смена номера'}));
  spB.appendChild(el('p',{text:'Смена номера на любую из 240 стран'}));
  sp.appendChild(spB);
  var spRight=el('div');
  spRight.appendChild(el('div',{class:'special-price',text:'100 ₽'}));
  spRight.appendChild(el('button',{class:'btn btn-primary btn-sm',text:'Купить',onclick:function(){window.open(tgSpecial(),'_blank')}}));
  sp.appendChild(spRight);
  wrap.appendChild(sp);
  p.appendChild(wrap);

  function rebuild(){
    if(ddValue)ddValue.textContent=state.country||'Страна';
    if(ydValue)ydValue.textContent=state.year||'Отлега';
    sUp.classList.toggle('active',state.sort==='asc');
    sDown.classList.toggle('active',state.sort==='desc');
    var list=buildList();
    grid.innerHTML='';
    meta.innerHTML='Найдено: <b>'+list.length+'</b>';
    if(!list.length){
      var e=el('div',{class:'empty'});
      e.appendChild(el('h3',{text:'Ничего не найдено'}));
      e.appendChild(el('p',{text:'Попробуйте изменить фильтры'}));
      grid.appendChild(e);
      return;
    }
    list.slice(0,120).forEach(function(item,i){grid.appendChild(makeCard(item,i))});
  }
  rebuild();
  return p;
}

function buildList(){
  var list=[];
  var q=state.country.toLowerCase().trim();
  COUNTRIES.forEach(function(c){
    if(state.country && c.n!==state.country){if(!q||(c.n.toLowerCase().indexOf(q)===-1 && c.c.indexOf(q)===-1))return}
    YEARS.forEach(function(y){
      if(state.year && String(y)!==state.year)return;
      list.push({country:c,year:y});
    });
  });
  if(state.sort==='asc'){
    list.sort(function(a,b){var pa=PRICE[a.year].p==null?Infinity:PRICE[a.year].p;var pb=PRICE[b.year].p==null?Infinity:PRICE[b.year].p;return pa-pb});
  }else if(state.sort==='desc'){
    list.sort(function(a,b){var pa=PRICE[a.year].p==null?-Infinity:PRICE[a.year].p;var pb=PRICE[b.year].p==null?-Infinity:PRICE[b.year].p;return pb-pa});
  }else{
    var seeded=shuffle(list.slice(0,300));
    list=seeded.concat(list.slice(300));
  }
  return list;
}

function makeCard(item,idx){
  var c=item.country,y=item.year,pr=PRICE[y];
  var card=el('div',{class:'card'});
  card.style.animationDelay=(Math.min(idx,20)*25)+'ms';
  var top=el('div',{class:'card-top'});
  top.appendChild(el('div',{class:'card-flag',text:c.f||'🌍'}));
  top.appendChild(el('div',{class:'card-year',text:String(y)}));
  card.appendChild(top);
  card.appendChild(el('div',{class:'card-country',text:c.n}));
  card.appendChild(el('div',{class:'card-code',text:c.c}));
  card.appendChild(el('div',{class:'card-divider'}));
  var row=el('div',{class:'card-row'});
  row.appendChild(el('div',{class:'card-label',text:'Цена'}));
  row.appendChild(el('div',{class:'card-price'+(pr.p==null?' ls':''),text:pr.l}));
  card.appendChild(row);
  var btn=el('button',{class:'btn btn-primary btn-block',text:'Купить'});
  btn.addEventListener('click',function(){window.open(tgBuy(c.n,c.c,y),'_blank')});
  card.appendChild(btn);
  return card;
}

function init(){
  var yr=$('#yr');
  if(yr)yr.textContent=new Date().getFullYear();
  initHeader();
  if(!location.hash)location.hash='#/';
  navigate();
}

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}

})();
</script>

</body>
</html>
